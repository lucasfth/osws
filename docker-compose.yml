# Copy .env.example to .env and fill in your values before running.
#
# To apply EF Core migrations:
#   docker compose run --rm osws-api dotnet ef database update \
#     --project OSWS.KeyManager --startup-project OSWS.WebApi

services:
  osws-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OswsContext=${OSWS_DB_CONNECTION}

      # Key Vault — set Provider to "Internal" for dev (keys lost on restart)
      - KeyVault__Provider=${KEY_VAULT_PROVIDER:-Azure}
      - KeyVault__VaultUri=${KEY_VAULT_VAULT_URI}
      - KeyVault__TenantId=${AZURE_TENANT_ID}
      - KeyVault__ClientId=${AZURE_CLIENT_ID}
      - KeyVault__ClientSecret=${AZURE_CLIENT_SECRET}

      # S3-compatible storage (e.g. Cloudflare R2)
      - S3Settings__EndpointHostname=${S3_ENDPOINT_HOSTNAME}
      - S3Settings__AccessKeyId=${S3_ACCESS_KEY_ID}
      - S3Settings__SecretAccessKey=${S3_SECRET_ACCESS_KEY}
      - S3Settings__Region=${S3_REGION:-auto}

      # OIDC providers — add more entries for additional providers
      - OidcProviders__0__Name=${OIDC_0_NAME:-pocketid}
      - OidcProviders__0__DisplayName=${OIDC_0_DISPLAY_NAME:-PocketID}
      - OidcProviders__0__Authority=${OIDC_0_AUTHORITY}
      - OidcProviders__0__Audience=${OIDC_0_AUDIENCE}
